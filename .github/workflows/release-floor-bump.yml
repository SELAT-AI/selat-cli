name: Open CLI release PR for new discovery/pay

# selat-cli is the propagation vehicle: the plugins runner only refreshes when
# selat-cli's npm `latest` moves, so every selat-discovery / selat-pay release must
# be followed by a CLI patch release raising the dependency floor. This opens that
# PR (version, floors, bin VERSION, lockfile). It never merges or publishes;
# merging the PR tags and publishes via auto-tag.yml.
#
# Triggers:
#   - repository_dispatch `dependency-published` (sent by selat-discovery / selat-pay
#     publish; payload: package, version) -- the normal path.
#   - workflow_dispatch -- manual fallback (inputs optional; both floors are moved
#     to the newest published release either way).
#
# Secret (optional but recommended): RELEASE_BOT_TOKEN, a PAT or GitHub App token
# with contents + pull-requests write. PRs opened with the default GITHUB_TOKEN do
# not trigger CI, so without it the PR gets no checks.

on:
  repository_dispatch:
    types: [dependency-published]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package that was just published (informational)'
        required: false
        type: string
      version:
        description: 'Version that was just published (waits for npm to serve it)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cli-release-floor-bump
  cancel-in-progress: false

jobs:
  bump:
    if: github.repository == 'SELAT-AI/selat-cli'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Wait for the published version on npm
        env:
          PKG: ${{ github.event.client_payload.package || inputs.package }}
          VER: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          set -euo pipefail
          [ -n "${PKG:-}" ] && [ -n "${VER:-}" ] || { echo "No package/version given; using newest on npm."; exit 0; }
          for i in $(seq 1 36); do
            if [ "$(npm view "${PKG}@${VER}" version 2>/dev/null || true)" = "${VER#v}" ]; then
              echo "${PKG}@${VER} is on npm"; exit 0
            fi
            sleep 10
          done
          echo "::error::${PKG}@${VER} did not appear on npm"; exit 1

      - name: Raise dependency floors
        id: floors
        run: node scripts/bump-dep-floors.mjs | tee floors.txt

      - name: Bump version, lockfile, and test
        id: release
        run: |
          set -euo pipefail
          if grep -q '^changed=false' floors.txt; then
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "Floors already current; no release PR needed."
            exit 0
          fi
          # `npm version` runs the sync-bin-version lifecycle (bin/selat.mjs VERSION).
          npm version patch --no-git-tag-version >/dev/null
          NEW="$(node -p "require('./package.json').version")"
          npm install --no-audit --no-fund
          npm test
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"
          { echo 'summary<<EOF'; grep -v '^changed=' floors.txt; echo 'EOF'; } >> "$GITHUB_OUTPUT"
          rm -f floors.txt

      - name: Open release PR
        if: steps.release.outputs.version != ''
        uses: peter-evans/create-pull-request@v7
        with:
          # RELEASE_BOT_TOKEN makes CI run on the PR; falls back to GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
          base: main
          branch: ci/release-v${{ steps.release.outputs.version }}
          delete-branch: true
          commit-message: 'chore(release): v${{ steps.release.outputs.version }}'
          title: 'chore(release): v${{ steps.release.outputs.version }}'
          body: |
            Patch release `${{ steps.release.outputs.version }}`: raises the dependency floors so the plugins runner picks up the new discovery/pay release.

            ```
            ${{ steps.release.outputs.summary }}
            ```

            Version, `bin/selat.mjs` VERSION, and the lockfile are updated; `npm test` passed in the workflow.

            After merge, `auto-tag.yml` tags and publishes, and the CLI publish notifies selat-plugins, which opens its runtime-refresh + plugin-bump PR.

            Generated by `Open CLI release PR for new discovery/pay`.
