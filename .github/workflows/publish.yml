name: Publish to npm

# Publishes @selat-ai/selat-cli to npm via Trusted Publishing (OIDC).
# No NPM_TOKEN secret required — npm verifies the publish via the
# GitHub OIDC token issued to this workflow. Configure on the npm side
# at https://www.npmjs.com/package/@selat-ai/selat-cli/access by adding
# this repo + workflow as a trusted publisher.
#
# The release gate installs from package-lock.json and runs the local checks
# before packing, so stale dependency pins or bundled-runtime drift fail before
# a trusted-publishing release can go out.
#
# Triggers:
#   - Pushing a tag like `v0.2.0` runs the full publish.
#   - workflow_dispatch lets you run a dry-run from the GitHub UI.
#
# PROPAGATION VEHICLE (runbook): this package's version is the ONLY
# signal the selat-plugins runner uses to refresh existing installs —
# it reinstalls the runtime when npm `latest` here moves, re-resolving
# selat-discovery and selat-pay in the process. Therefore every
# selat-discovery or selat-pay release MUST be followed by a patch
# release here that bumps the corresponding dependency floor.
# Checklist for that patch release:
#   1. package.json: bump "version" + the dep floor(s) (^X.Y.Z)
#   2. bin/selat.mjs: bump the VERSION constant
#   3. npm install (refresh lockfile), npm test
#   4. PR titled `chore(release): vX.Y.Z`, squash-merge, tag, push tag
#   5. After publish: run selat-plugins' "Sync selat-cli version"
#      workflow_dispatch and merge its marker PR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry-run only (skip the actual publish)'
        type: boolean
        default: true

permissions:
  id-token: write   # required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          echo "Tag and package.json both at ${PKG_VERSION}"

      - name: Verify bin/selat.mjs VERSION constant matches package.json
        # Catches the case where package.json is bumped but the hard-coded
        # VERSION constant printed by `selat --version` is not (or vice versa).
        # This drift shipped silently as 0.5.1 before being caught.
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          BIN_VERSION=$(node -p "const c = require('fs').readFileSync('bin/selat.mjs','utf8'); const m = c.match(/^const\s+VERSION\s*=\s*\"([^\"]+)\"/m); if(!m) throw new Error('VERSION constant not found in bin/selat.mjs'); m[1]")
          if [ "$BIN_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::bin/selat.mjs VERSION (${BIN_VERSION}) does not match package.json version (${PKG_VERSION})"
            exit 1
          fi
          echo "bin/selat.mjs VERSION and package.json both at ${PKG_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm test

      - name: Dry-run pack
        run: npm pack --dry-run

      - name: Upgrade npm (trusted publishing requires >=11.5.1)
        run: npm install -g npm@latest

      - name: Publish
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
        run: npm publish
