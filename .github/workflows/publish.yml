name: Publish to npm

# Publishes @selat-ai/selat-cli to npm via Trusted Publishing (OIDC).
# No NPM_TOKEN secret required — npm verifies the publish via the
# GitHub OIDC token issued to this workflow. Configure on the npm side
# at https://www.npmjs.com/package/@selat-ai/selat-cli/access by adding
# this repo + workflow as a trusted publisher.
#
# This workflow does NOT install dependencies — npm publish only packs
# files listed in package.json "files" and does not require node_modules.
# The @selat-ai/selat-pay dep (private scoped) would otherwise need an
# auth token here, which trusted publishing intentionally avoids.
#
# Triggers:
#   - Pushing a tag like `v0.2.0` runs the full publish.
#   - workflow_dispatch lets you run a dry-run from the GitHub UI.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry-run only (skip the actual publish)'
        type: boolean
        default: true

permissions:
  id-token: write   # required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          echo "Tag and package.json both at ${PKG_VERSION}"

      - name: Syntax check
        run: npm run check

      - name: Dry-run pack
        run: npm pack --dry-run

      - name: Upgrade npm (trusted publishing requires >=11.5.1)
        run: npm install -g npm@latest

      - name: Publish
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
        run: npm publish
